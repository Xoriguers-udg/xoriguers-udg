name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # the calendar sync starts this itself (a push made with its token would not):
  # when it changed something, and once a day so the agenda/historial split
  # follows the date. It used to start on every sync run; now that the sync
  # runs hourly, that would be 24 deploys a day for nothing.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      # editors upload photos straight from their phones; what is served is
      # shrunk here, so a new photo is light from its first deploy. The hourly
      # job commits the same result to the repo.
      - name: Compress uploaded images
        run: node --experimental-strip-types scripts/comprimeix-imatges.mjs public/images/uploads

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
