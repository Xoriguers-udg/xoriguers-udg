  - name: "configuracio"
    label: "Configuració"
    editor: { preview: false }
    description: "Xarxes socials, correu de contacte, ajustos generals i les categories de l'Agenda. No cal tocar-ho gaire sovint."
    files:
      - name: "general"
        label: "Configuració general"
        file: "src/content/configuracio/general.md"
        fields:
          - { label: "Email de contacte", name: "contacteComercialEmail", widget: "string", required: false, hint: "L'únic correu de la web: surt a Contacta'ns i hi arriben les reserves de la botiga." }
          - { label: "URL Instagram", name: "instagramUrl", widget: "string", required: false, hint: "L'adreça sencera, amb https://. Deixa buida qualsevol xarxa que no feu servir i no sortirà." }
          - { label: "URL YouTube", name: "youtubeUrl", widget: "string", required: false }
          - { label: "URL Facebook", name: "facebookUrl", widget: "string", required: false }
          - { label: "URL Twitter", name: "twitterUrl", widget: "string", required: false }
          - { label: "Fotografia de capçalera", name: "capceleraImatge", widget: "image", required: false, hint: "La foto que fan servir totes les pàgines que no en tenen una de pròpia." }
          - { label: "Descripció general (SEO)", name: "descripcioGeneral", widget: "text", required: false, hint: "El text que surt sota l'enllaç quan es comparteix la web o quan surt a Google. Una o dues frases curtes." }
          - label: "URL d'inserció de Google Calendar"
            name: "googleCalendarEmbedUrl"
            widget: "string"
            required: false
            hint: "No cal tocar-ho. És el calendari d'on l'agenda s'omple sola cada hora."
      # the agenda's categories: how each shows and behaves on the site, and the
      # words that classify calendar events into it (src/lib/categories.ts). An
      # agenda entry stores a category's identificador, so the name can change
      - name: "calendari"
        label: "Calendari: categories"
        file: "src/content/configuracio/calendari.md"
        fields:
          - label: "Categories"
            name: "categories"
            widget: "list"
            label_singular: "categoria"
            summary: "{{fields.nom}}"
            collapsed: true
            hint: "Les categories de l'Agenda: actuació, diada, assaig… Pots afegir-ne tantes com vulguis. Quan arriba una actuació nova del Google Calendar, es miren en aquest ordre i es queda la primera que té alguna de les seves paraules al nom; arrossega-les per canviar-ne l'ordre."
            fields:
              - { label: "Nom", name: "nom", widget: "string", hint: "Com surt a la web. Ex: Actuació" }
              - { label: "Identificador", name: "clau", widget: "string", hint: "Una paraula curta, sense espais, que no canviï mai: és el que guarda cada actuació de l'Agenda. Ex: cercavila. Si canvies el nom, deixa-ho igual." }
              - { label: "Paraules", name: "paraules", widget: "string", required: false, hint: "Les paraules del nom al calendari que la fan d'aquesta categoria, separades per comes. Ex: cercavila, passacarrer. No importen les majúscules ni els accents, i una paraula també troba les que comencen igual («actuació» troba «ACTUACIONS»)." }
              - label: "Color de l'etiqueta"
                name: "color"
                widget: "select"
                default: "blau"
                options:
                  - { label: "Blau", value: "blau" }
                  - { label: "Groc", value: "groc" }
                  - { label: "Verd", value: "verd" }
                  - { label: "Gris", value: "gris" }
              - { label: "Surt a l'agenda i a la portada", name: "agenda", widget: "boolean", default: true, hint: "Si no, les d'aquesta categoria no surten a «Pròximes actuacions» ni a la llista de l'Agenda (però sí al calendari)." }
              - label: "A l'historial"
                name: "historial"
                widget: "select"
                default: "sempre"
                hint: "Quan ja han passat. També decideix si els seus castells compten per a «Últims castells» i «Els nostres millors castells»."
                options:
                  - { label: "Sempre", value: "sempre" }
                  - { label: "Només si s'hi han fet castells", value: "ambCastells" }
                  - { label: "Mai", value: "mai" }
          - label: "Categoria si no hi ha cap paraula"
            name: "tipusPerDefecte"
            widget: "relation"
            collection: "configuracio"
            file: "calendari"
            value_field: "categories.*.clau"
            search_fields: ["categories.*.nom"]
            display_fields: ["categories.*.nom"]
            required: false
            hint: "La categoria d'una actuació nova amb un nom que no té cap de les paraules. Per exemple, «OCTOBERFEST». Si acabes d'afegir una categoria, desa primer perquè surti aquí."
