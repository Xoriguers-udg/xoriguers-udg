              - { label: "Una altra adreça", name: "adreca", widget: "string", required: false, hint: "Només si a «On porta» has triat «Una altra adreça». Una adreça sencera (https://…) s'obre en una pestanya nova; una part de la web, com galeria/diada-de-primavera-2026, s'obre a la mateixa." }
