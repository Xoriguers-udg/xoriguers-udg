# Use DecapBridge classic auth (required)
backend:
  name: git-gateway
  repo: Xoriguers-udg/xoriguers-udg
  branch: main
  identity_url: https://auth.decapbridge.com/sites/527cd3bc-1fbf-4d38-96e7-c294c4cec610
  gateway_url: https://gateway.decapbridge.com

  # See who did what (optional)
  commit_messages:
    create: Create {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

# The people who edit this are the colla's comunicació, not developers: the
# interface is in Catalan, it carries the colla's escut, and every button that
# says "view on site" lands on the right page.
locale: "ca"
logo_url: https://xoriguers-udg.github.io/xoriguers-udg/images/escut-xoriguers.png
site_url: https://xoriguers-udg.github.io/xoriguers-udg
display_url: https://xoriguers-udg.github.io/xoriguers-udg

# local_backend still lets `npm run dev:all` test against your local
# git checkout without touching DecapBridge/GitHub — Decap only honors
# this when the CMS is actually opened from localhost.
local_backend: true

# No editorial_workflow: one or two people run this site, so Save commits
# straight to main and the deploy takes it live. Nothing to mark ready, nothing
# to review, no pull request in between.

# file names made from a title lose their accents: "Comença" becomes "comenca"
slug:
  encoding: "ascii"
  clean_accents: true
  sanitize_replacement: "-"

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

# The preview pane: Agenda, Galeria, Notícies, Pàgines and the banners have one,
# drawn with the site's CSS by public/admin/preview.js. The rest (juntes,
# botiga, documents, settings) are forms with nothing worth previewing, so the
# pane is off there and «Veure publicació» opens the real page instead.
#
# The sidebar runs in the order people reach for things: the agenda and its
# photos first, the settings nobody needs to touch last. Every collection keeps
# its `name`, which is what the files and the commit messages use; only the
# labels, the order and the help changed.
collections:
  - name: "agenda"
    label: "Agenda"
    label_singular: "actuació"
    description: "Una entrada per a cada actuació, diada o assaig, del 1998 ençà. Les noves arriben soles des del Google Calendar de la colla, en una hora o dues; aquí s'hi afegeixen els castells, les fotos i les notes. Els canvis es veuen a la web en un parell de minuts."
    folder: "src/content/agenda"
    create: true
    # the agenda is 25 years of history: an entry that should not show is
    # set to Esborrany or Cancel·lada, never deleted
    delete: false
    preview_path: "agenda/{{slug}}"
    identifier_field: "nom"
    slug: "{{fields.data}}-{{fields.nom}}"
    # Decap only infers sortable fields called title/date/author/description, so
    # with 280-odd diades and Catalan field names the list arrived unsorted.
    summary: "{{data}} · {{nom}}"
    # newest first: what people open the agenda for is this season, not 1999
    sortable_fields: [{ field: "data", default_sort: "desc" }, "nom", "tipus"]
    view_groups:
      - label: "Any"
        field: "data"
        pattern: '\d{4}'
      - label: "Tipus"
        field: "tipus"
    view_filters:
      - label: "Actuacions"
        field: "tipus"
        pattern: "Actuacio"
      - label: "Diades"
        field: "tipus"
        pattern: "Diada"
      - label: "Assajos"
        field: "tipus"
        pattern: "Assaig"
      - label: "Amb observació"
        field: "observacio"
        pattern: "."
    fields:
      # the hourly import rewrites these five from Google Calendar (see
      # scripts/import-calendar.mjs, DEL_CALENDARI), so the hint sends people there
      - { label: "Nom", name: "nom", widget: "string", hint: "Si l'actuació ve del Google Calendar, canvia el nom allà: cada hora es torna a copiar del calendari." }
      - { label: "Data", name: "data", widget: "datetime", date_format: "DD/MM/YYYY", time_format: false, format: "YYYY-MM-DD", hint: "Si ve del Google Calendar, canvia-la allà." }
      - { label: "Hora", name: "hora", widget: "string", required: false, hint: "Ex: 12:30. Si ve del Google Calendar, canvia-la allà." }
      - { label: "Lloc", name: "lloc", widget: "string", required: false, hint: "Ex: Església de Sant Domènec. Si ve del Google Calendar, canvia'l allà." }
      - { label: "Població", name: "poblacio", widget: "string", required: false, hint: "Ex: Girona. Si ve del Google Calendar, canvia-la allà." }
      # the categories are the colla's own (Configuració → Calendari: categories)
      - label: "Tipus"
        name: "tipus"
        widget: "relation"
        collection: "configuracio"
        file: "calendari"
        value_field: "categories.*.clau"
        search_fields: ["categories.*.nom"]
        display_fields: ["categories.*.nom"]
        options_length: 50
        hint: "Les actuacions del calendari es classifiquen soles amb les paraules de cada categoria («Configuració» → «Calendari: categories»). Si n'hi tries una aquí, es queda la teva."
      # what the calendar sync last gave this entry: while «tipus» still equals
      # it, the category follows the words; once they differ, it was chosen
      # here and the sync leaves it (src/lib/categories.ts, tipusSincronitzat).
      # Hidden, but declared so saving from the CMS keeps it
      - { label: "Tipus posat pel calendari", name: "tipusCalendari", widget: "hidden", required: false }
      - { label: "Cartell", name: "cartell", widget: "image", required: false, hint: "El cartell de l'actuació, si n'hi ha. Surt a la seva fitxa." }
      - { label: "Colles participants", name: "collesParticipants", widget: "list", required: false, hint: "Les altres colles que hi actuen, separades per comes. Ex: Arreplegats, Ganàpies" }
      - { label: "Mostrar a portada", name: "mostrarPortada", widget: "boolean", default: false, required: false, hint: "Si ho marques, surt la primera a «Pròximes actuacions» de la portada, encara que n'hi hagi una altra abans. Si no en marques cap, surten per ordre de data." }
      - label: "Estat"
        name: "estat"
        widget: "select"
        options:
          - { label: "Publicat (es veu a la web)", value: "publicat" }
          - { label: "Esborrany (no es publica)", value: "esborrany" }
        default: "publicat"
      - { label: "Cancel·lada", name: "cancelada", widget: "boolean", default: false, required: false, hint: "Surt a la web amb l'etiqueta «Cancel·lada». Si ve del Google Calendar, es marca sola quan s'hi cancel·la." }
      # optional: the calendar importer creates entries with neither a description
      # nor mostrarPortada, and a required field there made every imported
      # actuació impossible to save from the CMS
      - { label: "Descripció", name: "body", widget: "markdown", required: false, hint: "Opcional. Què hi passarà o què hi va passar, en un parell de frases." }
      - label: "Castells"
        name: "castells"
        widget: "list"
        required: false
        label_singular: "castell"
        summary: "{{fields.castell}} · {{fields.estat}}"
        hint: "Un per castell, en l'ordre en què es van fer. Omplen l'historial, els millors castells de «La colla» i «Últims castells» de la portada."
        fields:
          - { label: "Castell", name: "castell", widget: "string", hint: "Com s'escriu: 3d8f, 4d7, 5d7, 3d7a, Pd6f, 2d6..." }
          - label: "Estat"
            name: "estat"
            widget: "select"
            options:
              - { label: "Descarregat (fet i desfet sencer)", value: "descarregat" }
              - { label: "Carregat (coronat, però va caure en baixar)", value: "carregat" }
              - { label: "Intent (no es va coronar)", value: "intent" }
          - { label: "Ronda", name: "ronda", widget: "number", required: false, value_type: "int", hint: "Opcional. 1, 2, 3..." }
          - { label: "Foto", name: "foto", widget: "image", required: false, hint: "Una foto d'aquest castell. Surt a la fitxa de la diada i, si és dels millors de la colla, a «La colla»." }
      - { label: "Observació", name: "observacio", widget: "string", required: false, hint: "Fites i notes: «Primer 5d7 de la història», «Cancel·lat per pluja». Es destaca a la fitxa i a l'historial." }
      - { label: "Compta per al CCCC", name: "cccc", widget: "boolean", default: false, required: false, hint: "No cal tocar-ho. Una marca que ve del registre antic; ara mateix no surt enlloc de la web." }
      - { label: "Notació original", name: "notacioOriginal", widget: "string", required: false, hint: "No cal tocar-ho. Els castells tal com es van escriure al registre antic." }
      - { label: "Identificador del calendari", name: "calendarUid", widget: "string", required: false, hint: "No el toquis mai. L'omple la importació del Google Calendar i és el que evita que l'actuació surti repetida." }

  - name: "galeria"
    label: "Galeria"
    label_singular: "àlbum"
    description: "Un àlbum per a cada diada o activitat. Un àlbum només surt a la web quan té almenys una foto, i a la portada quan en té tres o més."
    folder: "src/content/galeria"
    create: true
    preview_path: "galeria/{{slug}}"
    identifier_field: "nom"
    slug: "{{fields.nom}}"
    summary: "{{data}} · {{nom}}"
    sortable_fields: [{ field: "data", default_sort: "desc" }, "nom"]
    view_groups:
      - label: "Any"
        field: "data"
        pattern: '\d{4}'
    fields:
      - { label: "Nom", name: "nom", widget: "string", hint: "Ex: Diada de Primavera 2026" }
      - { label: "Data", name: "data", widget: "datetime", date_format: "DD/MM/YYYY", time_format: false, format: "YYYY-MM-DD", hint: "El dia de l'activitat. L'àlbum més recent és el que surt a la portada." }
      - { label: "Portada", name: "portada", widget: "image", required: false, hint: "La foto que representa l'àlbum a la Galeria. Si la deixes buida, es fa servir la primera foto." }
      - label: "Fotos"
        name: "fotos"
        widget: "list"
        required: false
        label_singular: "foto"
        hint: "Prem «Afegeix foto» per a cada foto. Surten en aquest ordre; es poden arrossegar per canviar-lo."
        field: { label: "Foto", name: "foto", widget: "image" }
      - label: "Estat"
        name: "estat"
        widget: "select"
        options:
          - { label: "Publicat (es veu a la web)", value: "publicat" }
          - { label: "Esborrany (no es publica)", value: "esborrany" }
        default: "publicat"

  - name: "noticies"
    label: "Notícies"
    label_singular: "notícia"
    description: "Les dues notícies publicades més recents surten a la portada. Mentre no n'hi ha cap de publicada, la secció Notícies queda amagada de tota la web."
    folder: "src/content/noticies"
    create: true
    preview_path: "noticies/{{slug}}"
    identifier_field: "titol"
    slug: "{{fields.titol}}"
    summary: "{{data}} · {{titol}}"
    sortable_fields: [{ field: "data", default_sort: "desc" }, "titol"]
    view_groups:
      - label: "Any"
        field: "data"
        pattern: '\d{4}'
    fields:
      - { label: "Títol", name: "titol", widget: "string" }
      - { label: "Data", name: "data", widget: "datetime", date_format: "DD/MM/YYYY", time_format: false, format: "YYYY-MM-DD" }
      - { label: "Resum", name: "resum", widget: "text", hint: "Una o dues frases. És el que surt a la portada i a la llista de notícies." }
      - { label: "Imatge", name: "imatge", widget: "image", required: false }
      - label: "Estat"
        name: "estat"
        widget: "select"
        hint: "Amb «Esborrany» la pots desar i acabar-la un altre dia sense que surti a la web."
        options:
          - { label: "Publicat (es veu a la web)", value: "publicat" }
          - { label: "Esborrany (no es publica)", value: "esborrany" }
        default: "publicat"
      - { label: "Cos", name: "body", widget: "markdown", hint: "El text sencer de la notícia." }

  - name: "pagines"
    label: "Pàgines"
    label_singular: "pàgina"
    description: "Els textos i les fotos de cada pàgina de la web. Les pàgines no es poden crear ni esborrar, només editar."
    files:
      - name: "inici"
        label: "Inici (portada)"
        file: "src/content/pagines/inici.md"
        preview_path: ""
        fields:
          - { label: "Titular principal", name: "titol", widget: "string", hint: "La frase gran en blanc sobre el blau, a dalt de tot. Com més curta, millor." }
          - { label: "Text del botó", name: "ctaText", widget: "string", required: false, hint: "Per defecte: «Vine a assajar»." }
          - { label: "Fotografia de portada", name: "imatge", widget: "image", required: false, hint: "La foto gran de la dreta, a dalt de tot." }
          - { label: "Títol de la presentació", name: "presentacioTitol", widget: "string", required: false, hint: "Per defecte: «Qui som»." }
          - { label: "Text de presentació", name: "body", widget: "markdown", required: false, hint: "Qui som, en un parell de frases. Surt a l'esquerra, al costat de les pròximes actuacions." }
          - { label: "Títol de les pròximes actuacions", name: "properesTitol", widget: "string", required: false, hint: "Per defecte: «Pròximes actuacions»." }
      - name: "la_colla"
        label: "La colla (Qui som)"
        file: "src/content/pagines/la-colla.md"
        preview_path: "la-colla"
        fields:
          - { label: "Títol", name: "titol", widget: "string" }
          - { label: "Text principal", name: "body", widget: "markdown", hint: "El primer paràgraf surt en gran a dalt de tot; la resta, a sota de la foto de tota la colla." }
          - { label: "Fotografia de capçalera", name: "imatge", widget: "image", required: false }
          - { label: "Foto de tota la colla", name: "fotoColla", widget: "image", required: false, hint: "Una foto de grup. Surt en gran a «La colla», i a la franja groga de la portada si Uneix-te no té foto pròpia." }
          - { label: "Instagram", name: "contacteInstagram", widget: "string", hint: "El nom d'usuari, amb @. Ex: @xoriguersudg" }
      - name: "uneix_te"
        label: "Uneix-te"
        file: "src/content/pagines/uneix-te.md"
        preview_path: "uneix-te"
        fields:
          - { label: "Títol", name: "titol", widget: "string" }
          - { label: "Text de la crida", name: "body", widget: "markdown", hint: "Text d'entrada de la pàgina. La primera frase també surt a la franja groga de la portada." }
          - label: "Curs de crèdits"
            name: "curs"
            widget: "object"
            required: false
            collapsed: false
            fields:
              - { label: "Títol", name: "titol", widget: "string", required: false }
              - { label: "Text", name: "text", widget: "text", required: false, hint: "Què és el curs i què cal fer per aprovar-lo." }
              - label: "Dades del curs"
                name: "dades"
                widget: "list"
                required: false
                label_singular: "dada"
                summary: "{{fields.etiqueta}}: {{fields.valor}}"
                hint: "Crèdits, preu… Cada dada surt com una etiqueta i el seu valor dins el quadre groc. Es poden afegir i treure lliurement."
                fields:
                  - { label: "Etiqueta", name: "etiqueta", widget: "string" }
                  - { label: "Valor", name: "valor", widget: "string" }
          - label: "Assajos"
            name: "assajos"
            widget: "list"
            required: false
            label_singular: "assaig"
            summary: "{{fields.titol}} · {{fields.ubicacio}}"
            hint: "Aquí és l'únic lloc on s'escriuen els horaris d'assaig: surten aquí, a «La colla», a la portada i, el dels músics, a «Xorimúsics»."
            fields:
              - { label: "Títol", name: "titol", widget: "string", hint: "Ex: Castellers, Músics" }
              - { label: "Text", name: "text", widget: "text", required: false, hint: "Curt: quan s'assaja. La primera línia és la que surt a la portada." }
              - { label: "Ubicació", name: "ubicacio", widget: "string", required: false, hint: "El nom del lloc o les coordenades 'latitud,longitud'. És el que busca el mapa." }
              - { label: "Clau", name: "clau", widget: "string", required: false, hint: "No cal tocar-ho. 'castellers' és l'assaig que surt a la portada i 'musics' el que surt a «Xorimúsics»." }
              - label: "Fotografies"
                name: "fotos"
                widget: "list"
                required: false
                label_singular: "fotografia"
                hint: "Surten en una filera a sota del bloc. Es poden deixar buides."
                field: { label: "Fotografia", name: "foto", widget: "image" }
          - { label: "Fotografia", name: "imatge", widget: "image", required: false, hint: "Surt a la capçalera d'aquesta pàgina i a la franja groga de la portada." }
      - name: "xorimusics"
        label: "Xorimúsics"
        file: "src/content/pagines/xorimusics.md"
        preview_path: "xorimusics"
        fields:
          - { label: "Títol", name: "titol", widget: "string" }
          - { label: "Text", name: "body", widget: "markdown" }
          - { label: "Fotografia de capçalera", name: "imatge", widget: "image", required: false }
          - label: "Partitures"
            name: "partitures"
            widget: "list"
            required: false
            label_singular: "partitura"
            summary: "{{fields.titol}}"
            hint: "Les partitures dels tocs, en PDF. Quan n'hi ha alguna, surt una llista a la pàgina."
            fields:
              - { label: "Títol", name: "titol", widget: "string", hint: "Ex: Toc de castells" }
              - { label: "Instrument", name: "instrument", widget: "select", options: ["Gralla", "Tabal", "Gralla i tabal"], required: false }
              - { label: "Fitxer", name: "fitxer", widget: "file", hint: "El PDF de la partitura." }
      - name: "mallarengues"
        label: "Mallarengues"
        file: "src/content/pagines/mallarengues.md"
        preview_path: "mallarengues"
        fields:
          - { label: "Títol", name: "titol", widget: "string" }
          - { label: "Text", name: "body", widget: "markdown" }
          - { label: "Fotografia de capçalera", name: "imatge", widget: "image", required: false }
      - name: "merchandising"
        label: "Botiga (text de la pàgina)"
        file: "src/content/pagines/merchandising.md"
        preview_path: "merchandising"
        fields:
          - { label: "Titular", name: "titol", widget: "string" }
          - { label: "Text", name: "body", widget: "markdown", hint: "Com es reserva i es recull. Els productes s'editen a «Botiga: productes»." }
          - { label: "Fotografia de capçalera", name: "imatge", widget: "image", required: false }
      - name: "col_laboradors"
        label: "Col·laboradors i Contacta'ns"
        file: "src/content/pagines/col-laboradors.md"
        preview_path: "col-laboradors"
        fields:
          - { label: "Titular", name: "titol", widget: "string", hint: "El títol de la secció Contacta'ns." }
          - { label: "Text", name: "body", widget: "markdown", hint: "El text de Contacta'ns, al costat dels botons de correu i d'Instagram. El correu es canvia a «Configuració»." }
          - { label: "Fotografia de capçalera", name: "imatge", widget: "image", required: false }
      - name: "col_laboradors_intro"
        label: "Col·laboradors (text sobre els patrocinadors)"
        file: "src/content/pagines/col-laboradors-intro.md"
        preview_path: "col-laboradors"
        fields:
          - { label: "Text introductori", name: "body", widget: "markdown", required: false, hint: "Només surt quan hi ha algun patrocinador, a sobre dels seus logotips." }

  # the list pages have no text of their own besides a banner photo and an
  # intro, so they sit apart from the real pages
  - name: "capcaleres"
    label: "Capçaleres de les llistes"
    label_singular: "capçalera"
    description: "La foto de capçalera i el text d'entrada de les pàgines que són llistes (Agenda, Galeria...). Si no hi poses foto, es fa servir la de «Configuració»."
    files:
      - name: "capcalera_agenda"
        label: "Agenda"
        file: "src/content/pagines/agenda.md"
        preview_path: "agenda"
        fields:
          - { label: "Fotografia de capçalera", name: "imatge", widget: "image", required: false }
          - { label: "Text introductori", name: "body", widget: "markdown", required: false, hint: "Text curt que es mostra a sota del títol. Es pot deixar buit." }
      - name: "capcalera_castells"
        label: "Historial de castells"
        file: "src/content/pagines/castells.md"
        preview_path: "castells"
        fields:
          - { label: "Títol", name: "titol", widget: "string", required: false }
          - { label: "Fotografia de capçalera", name: "imatge", widget: "image", required: false }
          - { label: "Text introductori", name: "body", widget: "markdown", required: false, hint: "Text curt que es mostra a sota del títol. Es pot deixar buit." }
      - name: "capcalera_galeria"
        label: "Galeria"
        file: "src/content/pagines/galeria.md"
        preview_path: "galeria"
        fields:
          - { label: "Fotografia de capçalera", name: "imatge", widget: "image", required: false }
          - { label: "Text introductori", name: "body", widget: "markdown", required: false, hint: "Text curt que es mostra a sota del títol. Es pot deixar buit." }
      - name: "capcalera_noticies"
        label: "Notícies"
        file: "src/content/pagines/noticies.md"
        preview_path: "noticies"
        fields:
          - { label: "Fotografia de capçalera", name: "imatge", widget: "image", required: false }
          - { label: "Text introductori", name: "body", widget: "markdown", required: false, hint: "Text curt que es mostra a sota del títol. Es pot deixar buit." }
      - name: "capcalera_documents"
        label: "Documents"
        file: "src/content/pagines/documents.md"
        preview_path: "documents"
        fields:
          - { label: "Fotografia de capçalera", name: "imatge", widget: "image", required: false }
          - { label: "Text introductori", name: "body", widget: "markdown", required: false }
      - name: "junta_directiva_capcalera"
        label: "Junta directiva"
        file: "src/content/pagines/junta-directiva.md"
        preview_path: "junta-directiva"
        fields:
          - { label: "Fotografia de capçalera", name: "imatge", widget: "image", required: false }
          - { label: "Text introductori", name: "body", widget: "markdown", required: false }
      - name: "junta_tecnica_capcalera"
        label: "Junta tècnica"
        file: "src/content/pagines/junta-tecnica.md"
        preview_path: "junta-tecnica"
        fields:
          - { label: "Fotografia de capçalera", name: "imatge", widget: "image", required: false }
          - { label: "Text introductori", name: "body", widget: "markdown", required: false }

  - name: "productes"
    label: "Botiga: productes"
    editor: { preview: false }
    label_singular: "producte"
    description: "Els productes de la botiga. Les reserves arriben al correu de contacte de «Configuració»."
    folder: "src/content/productes"
    create: true
    preview_path: "merchandising/{{slug}}"
    identifier_field: "nom"
    slug: "{{fields.nom}}"
    summary: "{{nom}} · {{estat}}"
    fields:
      - { label: "Nom", name: "nom", widget: "string" }
      - { label: "Preu (€)", name: "preu", widget: "number" }
      - label: "Categoria"
        name: "categoria"
        widget: "select"
        options: ["Roba", "Dessuadora", "Complements"]
      - label: "Estat"
        name: "estat"
        widget: "select"
        options: ["Disponible", "Fora de termini"]
        default: "Disponible"
        hint: "«Fora de termini» el deixa a la botiga però sense poder-lo reservar."
      - label: "Fotos"
        name: "fotos"
        widget: "list"
        required: false
        label_singular: "foto"
        hint: "La primera és la que surt a la llista. Sense fotos, surt l'escut."
        field: { label: "Foto", name: "foto", widget: "image" }
      - label: "Talles i estoc"
        name: "talles"
        widget: "list"
        required: false
        label_singular: "talla"
        summary: "{{fields.talla}} · {{fields.estoc}}"
        fields:
          - { label: "Talla", name: "talla", widget: "string", hint: "Ex: S, M, L, XL, XXL, o Única" }
          - { label: "Estoc", name: "estoc", widget: "number", required: false, value_type: "int", hint: "Quantes en queden. Amb 0, la talla surt com a esgotada." }
      - { label: "Ordre", name: "ordre", widget: "number", required: false, value_type: "int", hint: "Ordre a la botiga, de més petit a més gran." }

