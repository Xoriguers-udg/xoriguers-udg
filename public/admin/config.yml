              - { label: "Columna del peu", name: "peu", widget: "select", default: "cap", options: [{ label: "Primera (La colla)", value: "colla" }, { label: "Segona (Castells)", value: "castells" }, { label: "Tercera (Organització)", value: "organitzacio" }, { label: "Quarta, sota les xarxes socials", value: "xarxes" }, { label: "No surt al peu", value: "cap" }] }
