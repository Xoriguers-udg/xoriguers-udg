              - { label: "Col·laboradors", name: "col-laboradors", widget: "boolean", default: false }
              - { label: "Botiga", name: "merchandising", widget: "boolean", default: false }
              - { label: "Uneix-te", name: "uneix-te", widget: "boolean", default: false }
